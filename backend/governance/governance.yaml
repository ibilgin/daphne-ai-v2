# Governance Gate Configuration — Sketch to Story platform, Phase 5
#
# This file is the machine-readable checklist read by gate_runner.py.
# ALL checks with required: true must have status: pass before any model
# Production alias update.
#
# EU AI Act classification: Limited Risk (creative content, non-consequential).
# Additional obligations triggered by processing children's data:
#   - Transparency notice to parents before use
#   - Data minimisation (hashes only in audit log)
#   - Human review queue for escalated safety cases
#   - Audit trail for every inference
#
# gate_runner.py evaluates each check's status field at CI time.
# Checks with type: metric are validated against threshold values.
# Checks with type: boolean are validated as pass/fail only.

checks:
  safety_gate:
    name: Child Safety Gate
    type: boolean
    required: true
    status: pass
    description: >
      Every generated story must pass Detoxify multilingual thresholds:
      toxicity < 0.1 and identity_attack < 0.05 per panel.
      Implemented in backend/security/safety_gate.py.
    last_verified: "2026-06-05"

  quality_gate:
    name: Model Quality Gate
    type: metric
    required: true
    status: pass
    thresholds:
      meteor_min: 0.35
      bertscore_f1_min: 0.75
    description: >
      Captioner promotion requires METEOR > 0.35 AND BERTScore F1 > 0.75.
      Evaluated by backend/eval/captioner_eval.py and enforced by
      backend/eval/quality_gate.py.
    last_verified: "2026-06-05"

  bias_audit:
    name: Fairlearn Bias Audit
    type: metric
    required: true
    status: pass
    thresholds:
      demographic_parity_difference_max: 0.1
    description: >
      Fairlearn MetricFrame demographic parity difference across age_group
      proxy must be <= 0.1. Run backend/governance/bias_audit.py.
    last_verified: "2026-06-05"

  model_card:
    name: Model Card Generated
    type: boolean
    required: true
    status: pass
    description: >
      A non-empty model card must exist in backend/governance/model_cards/
      for every registered model version. Generated by model_card_generator.py.
    last_verified: "2026-06-05"

  eu_ai_act:
    name: EU AI Act Classification Documented
    type: boolean
    required: true
    status: pass
    description: >
      System classified as Limited Risk under EU AI Act (creative content
      generation, non-consequential decisions). Additional obligations
      for processing children's data are documented in
      docs/governance/ai-act-classification.md and implemented:
      transparency notice, data minimisation, human review queue, audit trail.
    last_verified: "2026-06-05"

  audit_log_enabled:
    name: Audit Log Enabled
    type: boolean
    required: true
    status: pass
    description: >
      AuditLogger.log_job() must be called for every job, including failures.
      Stores SHA-256 hashes only — never raw image bytes or child names.
      Implemented in backend/security/audit_log.py.
    last_verified: "2026-06-05"

  data_minimisation_verified:
    name: Data Minimisation Verified
    type: boolean
    required: true
    status: pass
    description: >
      Verified that no raw image bytes, caption text, story text, or child
      names are stored in any persistent store (Postgres, Redis, MinIO, logs).
      Only SHA-256 hashes appear in the audit log.
    last_verified: "2026-06-05"

  input_validation_present:
    name: Input Validation Present
    type: boolean
    required: true
    status: pass
    description: >
      validate_image() runs before any model call on POST /api/generate-comic.
      Checks: size < 5 MB, valid magic bytes (JPEG/PNG), std dev > 10,
      aspect ratio 0.3-3.0. Implemented in backend/security/input_validator.py.
    last_verified: "2026-06-05"

  vault_secrets_confirmed:
    name: Vault Secrets Confirmed
    type: boolean
    required: true
    status: pass
    description: >
      All credentials (minio_access_key, minio_secret_key, db_password,
      jwt_secret, webhook_secret) are read from Vault KV v2 at startup.
      No hardcoded credentials anywhere. backend/security/vault_client.py.
    last_verified: "2026-06-05"

  rollback_tested:
    name: Model Rollback Tested
    type: boolean
    required: true
    status: pass
    description: >
      Model rollback workflow has been exercised: Production alias reverted
      to previous version when quality metrics degrade. Tested via
      act -j rollback --secret-file .secrets.
    last_verified: "2026-06-05"

  panel_image_gen_registered:
    name: Panel Image Gen Model Registered
    type: boolean
    required: false
    status: pass
    description: >
      panel_image_gen pyfunc model registered in MLflow with Production alias.
      Selects backend via PANEL_IMG_GEN_BACKEND env var:
        pil       — PIL pencil-sketch + mood tint (always available, no API key)
        stability — Stability AI /v2beta/stable-image/control/sketch
        hf_api    — HuggingFace Inference API img2img
      API credentials injected via Vault; never hardcoded. Falls back to PIL
      pencil-sketch automatically when registry model is absent.
      Implemented in backend/models/panel_image_gen.py.
    last_verified: "2026-06-07"

  narrative_input_sanitised:
    name: Rough Narrative Input Sanitised
    type: boolean
    required: true
    status: pass
    description: >
      rough_narrative field on POST /api/generate-comic is stripped and capped
      at 2000 characters before being passed to Celery.  Only the SHA-256 hash
      is written to the audit log — raw narrative text is never persisted.
      The safety gate (Detoxify) runs on all generated panel text regardless of
      whether a narrative was provided.
    last_verified: "2026-06-07"
