name: Model CI

on:
  push:
    branches:
      - "phase/1-mlops"
      - main
    paths:
      - "backend/**"
      - ".github/workflows/model-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
  workflow_dispatch:

env:
  MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
  MLFLOW_S3_ENDPOINT_URL: ${{ secrets.MINIO_ENDPOINT_URL }}
  AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
  PYTHON_VERSION: "3.11"

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1: Lint
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check backend/

      - name: Run ruff format check
        run: ruff format --check backend/

  # ---------------------------------------------------------------------------
  # Stage 2: Unit tests
  # ---------------------------------------------------------------------------
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd backend
          pip install uv
          uv pip install --system -r requirements.txt

      - name: Run storyteller tests (mocked — no GPU needed)
        run: |
          cd backend
          pytest tests/test_storyteller.py -v --tb=short

      - name: Run captioner tests (CPU inference)
        run: |
          cd backend
          pytest tests/test_captioner.py -v --tb=short -m "not slow"
        env:
          HF_HUB_OFFLINE: "0"

  # ---------------------------------------------------------------------------
  # Stage 3: Eval — run captioner on test set, record raw metrics
  # ---------------------------------------------------------------------------
  eval:
    name: Eval (captioner on test set)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd backend
          pip install uv
          uv pip install --system -r requirements.txt

      - name: Generate captions on 20-image test set
        run: |
          cd backend
          python - <<'PYEOF'
          import base64, io, json, sys, hashlib
          from pathlib import Path
          from PIL import Image
          import pandas as pd

          sys.path.insert(0, ".")
          from models.captioner import CaptionerModel

          def grey_png_b64(i):
              img = Image.new("RGB", (64, 64), color=(200 - i * 3, 200, 200))
              buf = io.BytesIO()
              img.save(buf, format="PNG")
              return base64.b64encode(buf.getvalue()).decode()

          model = CaptionerModel()
          class Ctx: artifacts = {}
          model.load_context(Ctx())

          results = []
          for i in range(20):
              b64 = grey_png_b64(i)
              row = pd.DataFrame([{"image_bytes": b64}])
              r = model.predict(None, row)
              results.append({"idx": i, "caption": r["caption"], "latency_ms": r["latency_ms"]})

          with open("eval_results.json", "w") as f:
              json.dump(results, f, indent=2)
          print(f"Eval complete: {len(results)} captions generated")
          PYEOF

      - name: Upload eval results
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: backend/eval_results.json

  # ---------------------------------------------------------------------------
  # Stage 4: Quality gate
  # ---------------------------------------------------------------------------
  quality_gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: eval
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd backend
          pip install uv
          uv pip install --system -r requirements.txt

      - name: Download eval results
        uses: actions/download-artifact@v4
        with:
          name: eval-results
          path: backend/

      - name: Run quality gate
        run: |
          cd backend
          python eval/quality_gate.py
        # Exits non-zero if METEOR <= 0.35 or BERTScore F1 <= 0.75

  # ---------------------------------------------------------------------------
  # Stage 5: Register
  # ---------------------------------------------------------------------------
  register:
    name: Register models
    runs-on: ubuntu-latest
    needs: quality_gate
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd backend
          pip install uv
          uv pip install --system -r requirements.txt

      - name: Register captioner and storyteller
        run: |
          cd backend
          python scripts/register_models.py

  # ---------------------------------------------------------------------------
  # Stage 6: Canary
  # ---------------------------------------------------------------------------
  canary:
    name: Canary check (champion vs challenger)
    runs-on: ubuntu-latest
    needs: register
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd backend
          pip install uv
          uv pip install --system -r requirements.txt

      - name: Run canary check
        run: |
          cd backend
          WINNER=$(python scripts/canary_check.py)
          echo "Canary winner: $WINNER"
          echo "CANARY_WINNER=$WINNER" >> "$GITHUB_ENV"

      - name: Report winner
        run: |
          echo "Champion-challenger result: $CANARY_WINNER"
          if [ "$CANARY_WINNER" = "Staging" ]; then
            echo "Challenger outperformed Champion — promote via /model-promote"
          else
            echo "Champion holds — no alias change needed"
          fi
