version: "3.9"

# ---------------------------------------------------------------------------
# Monitoring stack — Phase 4
#
# Extends the base stack defined in ../docker-compose.yml.
# Prometheus scrapes FastAPI (:8000/metrics) and the Evidently exporter (:9101).
# Grafana is provisioned with the Prometheus datasource and the comic-platform
# dashboard on first boot (idempotent via uid).
#
# Usage:
#   docker compose -f ../docker-compose.yml \
#                  -f monitoring/docker-compose-monitoring.yml up -d
#
# The services below join the same network as the base stack so they can
# resolve "fastapi", "redis", etc. by service name.
# ---------------------------------------------------------------------------

networks:
  monitoring:
    driver: bridge
  # Re-use the base compose default network so services can reach each other
  default:
    name: daphne-v2_default
    external: true

services:

  # -------------------------------------------------------------------------
  # Prometheus
  # -------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: daphne-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    networks:
      - default
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------------
  # Alertmanager
  # -------------------------------------------------------------------------
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: daphne-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/config.yml:/etc/alertmanager/config.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/config.yml"
      - "--storage.path=/alertmanager"
      - "--web.external-url=http://localhost:9093"
    networks:
      - default
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------------
  # Evidently exporter  (reads drift_*.json, exposes ml_drift_psi on :9101)
  # -------------------------------------------------------------------------
  evidently-exporter:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: daphne-evidently-exporter
    restart: unless-stopped
    command:
      - "python"
      - "-m"
      - "monitoring.evidently_exporter"
    environment:
      EVIDENTLY_EXPORTER_PORT: "9101"
      EVIDENTLY_REFRESH_INTERVAL: "60"
      EVIDENTLY_REPORTS_DIR: "/app/monitoring/reports"
    ports:
      - "9101:9101"
    volumes:
      - evidently-reports:/app/monitoring/reports
    networks:
      - default
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9101/metrics"]
      interval: 30s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------------
  # Drift reporter  (cron-style job; runs and exits; Compose restart handles it)
  # -------------------------------------------------------------------------
  drift-reporter:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: daphne-drift-reporter
    restart: "no"
    command:
      - "python"
      - "-m"
      - "monitoring.drift_reporter"
    environment:
      DRIFT_DB_PATH: "/app/monitoring/captions.db"
      DRIFT_REPORTS_DIR: "/app/monitoring/reports"
    volumes:
      - drift-db:/app/monitoring
      - evidently-reports:/app/monitoring/reports
    networks:
      - default

  # -------------------------------------------------------------------------
  # Grafana
  # -------------------------------------------------------------------------
  grafana:
    image: grafana/grafana-oss:10.4.3
    container_name: daphne-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/dashboard.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboard.json:/etc/grafana/dashboards/dashboard.json:ro
      - grafana-data:/var/lib/grafana
    networks:
      - default
      - monitoring
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  evidently-reports:
  drift-db:
