global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: fastapi
    static_configs:
      - targets:
          - fastapi:8000
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: evidently
    static_configs:
      - targets:
          - evidently-exporter:9101
    metrics_path: /metrics
    scrape_interval: 60s

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
