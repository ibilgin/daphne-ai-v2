global:
  resolve_timeout: 5m

route:
  receiver: retrain-hook
  group_by: ["alertname", "feature"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h
  routes:
    - match:
        alertname: CaptionDriftHigh
      receiver: retrain-hook
      continue: false
    - match:
        severity: critical
      receiver: retrain-hook
      continue: true

receivers:
  - name: retrain-hook
    webhook_configs:
      - url: http://fastapi:8000/hooks/retrain
        send_resolved: false
        http_config:
          follow_redirects: true
        max_alerts: 1

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ["alertname"]
