global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "fastapi"
    static_configs:
      - targets: ["localhost:{{ cookiecutter.fastapi_port }}"]
    metrics_path: /metrics

  - job_name: "mlflow"
    static_configs:
      - targets: ["localhost:{{ cookiecutter.mlflow_port }}"]
    metrics_path: /metrics

  # Add additional scrape targets here as you instrument your services.
  # Example: evidently drift exporter
  # - job_name: "evidently_exporter"
  #   static_configs:
  #     - targets: ["localhost:9101"]
